name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: chevra-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          python -m pip install --disable-pip-version-check pdfplumber==0.11.10 reportlab==4.4.9

      - name: Rebuild the lists and the map data
        run: python scripts/build_dataset.py

      - name: Fail if the committed data drifted
        run: git diff --ignore-cr-at-eol --exit-code -- data/burials.csv data/plots.csv data/qa-issues.csv web/cemetery.json

      - name: Build the printable map
        run: python scripts/build_pdf.py

      - name: Upload the data files
        uses: actions/upload-artifact@v4
        with:
          name: chevra-data
          retention-days: 90
          if-no-files-found: error
          path: |
            data/burials.csv
            data/plots.csv
            data/qa-issues.csv
            web/cemetery.json

      - name: Upload the printable map
        uses: actions/upload-artifact@v4
        with:
          name: chevra-map-pdf
          retention-days: 90
          if-no-files-found: error
          path: print/chevra-ahavas-chesed.pdf

      - name: Upload the website
        if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
